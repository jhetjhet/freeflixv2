# Django backend endpoints
location ~ ^/(api|auth|admin|share)(/|$) {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Django static files
location /static/admin/ {
    alias /usr/share/nginx/html/static/admin/;
    expires 30d;
    add_header Cache-Control "public, immutable";
}

# Node backend API
# When running multiple node-media-server instances, define them in an
# upstream block with consistent hash routing so requests for the same
# torrent infoHash (embedded in the /stream/ URI) always reach the same
# instance. This prevents duplicate torrent downloads across instances.
#
# Example multi-instance setup (uncomment and adjust as needed):
#
#   upstream node_backend_stream {
#       hash $uri consistent;   # routes /stream/<infoHash> to the same instance
#       server node_backend_1:8080;
#       server node_backend_2:8080;
#       server node_backend_3:8080;
#   }
#
# Then change the proxy_pass in the /node/stream/ block below to:
#   proxy_pass http://node_backend_stream/stream/;

location /node/stream/ {
    client_max_body_size 100M;

    proxy_pass http://node_backend:8080/stream/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Disable proxy buffering for streaming responses so data flows
    # directly to the client without accumulating in nginx memory.
    proxy_buffering off;
}

# Torrent worker — data plane for WebTorrent streaming.
# For multi-worker scaling, replace proxy_pass with an upstream block using
# hash $uri consistent to route by infoHash, e.g.:
#
#   upstream torrent_workers {
#       hash $uri consistent;
#       server torrent_worker_1:8081;
#       server torrent_worker_2:8081;
#   }
#
# Then change proxy_pass to: proxy_pass http://torrent_workers/;
location /torrent/ {
    proxy_pass http://torrent_worker:8081/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location /node/ {
    client_max_body_size 100M;

    proxy_pass http://node_backend:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /media/ {
    alias /usr/share/nginx/media/;

    try_files $uri $uri.mp4 $uri.mkv $uri.webm =404;

    types {
        video/mp4  mp4;
        video/webm webm;
        video/ogg  ogv ogg;
        video/x-matroska mkv;
        video/quicktime mov;
        video/x-msvideo avi;
        video/x-msvideo flv;

        text/vtt vtt;
        application/x-subrip srt;
    }

    default_type application/octet-stream;

    add_header Accept-Ranges bytes;

    if ($request_method = OPTIONS) {
        return 204;
    }
}